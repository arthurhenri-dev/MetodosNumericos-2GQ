[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planejamento-capacidade-servidores"
version = "0.1.0"
description = "Projeto de Métodos Numéricos para análise e previsão do crescimento do armazenamento de servidores."
requires-python = ">=3.10"
dependencies = [
    "numpy", 
    "pandas",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel"
]

[tool.setuptools.packpages.find]
include = ["metodos*"]